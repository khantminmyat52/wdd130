<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Contact Us</title>
    <meta name="description"
      content="This website will be included with our contact information and our location. We also uploaded the picture of our best employee.">
    <meta name="author" content="Khant Min Myat">
    <link rel='stylesheet' href='styles/rafting.css'>

</head>

<body>
    <header class="heading">
        <img src="images/rafting_logo.jpg" alt="Rafting logo" width="100">
        <nav class="socialmedia1">
            <a href="index.htm">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="contact-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main Street Kolob, California</p>
            <p>+66 094 878 4348</p>
            <p>khantminmyat151@gamil.com</p>
        </div>
        <div class="main-holder">
            <section class="location">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d44638.92015148872!2d98.5354478367731!3d8.541986558355642!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1smy!2sth!4v1780760610889!5m2!1smy!2sth"
                  width="500px" height="300px" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </section>
            <div class="poll">
                <form>
                    <div class="form-username">
                        <label for="username">Name</label>
                        <input type="text" id="username" name="username" placeholder="David....">
                    </div>
                    <div class="form-gmail">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email"
                          placeholder="khantminmyat151@gamil.com">
                    </div>
                    <div class="form-group radio-container">
                        <label>Message Purpose</label>

                        <div class="radio-option">
                            <input type="radio" id="general" name="purpose" checked>
                            <label for="general">General Inquiry</label>
                        </div>

                        <div class="radio-option">
                            <input type="radio" id="reservation" name="purpose">
                            <label for="reservation">Reservation Question</label>
                        </div>

                        <div class="radio-option">
                            <input type="radio" id="website" name="purpose">
                            <label for="website">Website Suggestion</label>
                        </div>
                    </div>


                    <label for="message" class="form-textarea">Message</label>
                    <div class=" form-textarea">
                        <textarea id="message" name="message" rows="3" required
                          placeholder="Type here"></textarea>
                    </div>
                    <input type="checkbox" id="newsletter" name="newsletter" class="sub">
                    <label for="newsletter" class="sub">Please subscribe me to the monthly
                        newsletter</label>

                    <button class="btm-form" type="submit">Get in touch!</button>
                </form>
            </div>
        </div>
        <section class="last-hero">
            <h2>We Are Here To Serve You</h2>
            <div class="flexbox">
                <figure>
                    <img src="images/adventure_pic1.webp" alt="Rafting picture">
                    <figcaption>Rafting crew!</figcaption>
                </figure>
                <figure>
                    <img src="images/adventure_pic2.webp" alt="Rafting picture">
                    <figcaption>Mountain rapids</figcaption>
                </figure>
                <figure>
                    <img src="images/adventure_pic3.webp" alt="Rafting picture">
                    <figcaption>Paddle hard!</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>©2026 | Khant Min Myat | K Rafting Company</p>
        <nav class="socialapp socialmedia">
            <a href="https://www.facebook.com/share/1EaZS1wE96/">
                <img src="images/facebook_logo.webp" alt="" width="50">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin_logo.webp" alt="" width="50">
            </a>
            <a href="https://wa.me/qr/IH3NGKLYUM4BO1">
                <img src="images/whatsapp_logo.webp" alt="" width="50">
            </a>
        </nav>

    </footer>

</body>

</html>
