<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Poll-form</title>
    <link rel='stylesheet' href='styles/poll-form.css'>
</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <>
            <div class="form-item column2">
                <label for="fullname">Full Name:</label>
                <input type="name" id="name" name="fullname" required>
            </div>
            <div class="form-item column2">
                <label for="emial">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-item column1">
                <label for="browser">What is your favorite browser</label>
                <select name="browser" id="browser">
                    <option value="Chrome">Chrome</option>
                    <option value="Safari">Safari</option>
                    <option value="Edge">Edge</option>
                    <option value="Brave">Brave</option>
                </select>
            </div>

            <div class="form-item column1">
                <label for="pet">Do you have a household pet</label>
                <input type="checkbox" id="pet" name="pet">
            </div>

            <div class="form-item">
                <label for="Feedback">List the place you have lived</label>
                <textarea id="Feedback" name="Feedback" rows="4"
                  placeholder="Singapore, Canada, Italy"></textarea>
            </div>

            <button type="submit">Submit Poll</button>
            </form>
    </main>

</body>

</html>
